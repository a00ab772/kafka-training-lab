##################################################
#  CONFIGURACIÓN DEL CONECTOR
#
# Estos son los parámetros estandar mínimos que todos los conectores necesitarán
# Sin estos tres parámetros, Kafka Connect no sabe lo que tiene que hacer
name=file-stream-demo-standalone
connector.class=org.apache.kafka.connect.file.FileStreamSourceConnector
tasks.max=1

# Parámetros del conector FileStreamSourceConnector
# Más información acerca de los parametros:
# https://github.com/apache/kafka/blob/trunk/connect/file/src/main/java/org/apache/kafka/connect/file/FileStreamSourceConnector.java
file=/tmp/demo-file.txt
topic=demo-1-standalone
