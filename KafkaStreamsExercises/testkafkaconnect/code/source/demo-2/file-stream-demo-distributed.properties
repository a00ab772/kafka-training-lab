# Estos son los parámetros estandar mínimos que todos los conectores necesitarán
name=file-stream-demo-distributed
connector.class=org.apache.kafka.connect.file.FileStreamSourceConnector
tasks.max=1
# Más información acerca de los parametros:
# https://github.com/apache/kafka/blob/trunk/connect/file/src/main/java/org/apache/kafka/connect/file/FileStreamSourceConnector.java
file=/tmp/demo-file.txt
topic=demo-2-distributed
# Configuración para el modo distribuído. Muy similar a la configuración de Worker.properties del modo standalone
key.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=true
